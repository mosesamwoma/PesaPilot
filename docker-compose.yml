# ────────────────────────────────────────────────────────
# PesaPilot — production Docker Compose (Baileys)
#
# Run with:
#   docker compose up -d --build
#   docker compose logs -f pesapilot
# ────────────────────────────────────────────────────────

services:
  pesapilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pesapilot-bot
    restart: unless-stopped
    ports:
      # The API has no authentication, so it is published on the host's
      # loopback only. To expose it elsewhere set API_BIND=0.0.0.0 in .env
      # (and put it behind a firewall / reverse proxy with auth).
      - "${API_BIND:-127.0.0.1}:8000:8000"
    environment:
      # API Configuration
      - API_URL=${API_URL:-http://127.0.0.1:8000}
      - WHATSAPP_API_PORT=8000
      - API_BIND_HOST=0.0.0.0
      - CORS_ORIGINS=${CORS_ORIGINS:-}

      # PostgreSQL runs separately on the host or another server —
      # this container never starts or manages a database itself.
      # POSTGRES_HOST=auto lets src/database.py detect that it's inside
      # Docker and resolve host.docker.internal itself (the extra_hosts
      # entry below is what makes that hostname resolve on Linux; it's
      # automatic on Docker Desktop for Mac/Windows). Set POSTGRES_HOST
      # to an explicit host/IP here if Postgres runs elsewhere entirely.
      - POSTGRES_USER=${POSTGRES_USER:-pesapilot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pesapilot}
      - POSTGRES_DB=${POSTGRES_DB:-pesapilot}
      - POSTGRES_HOST=${POSTGRES_HOST:-auto}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}

      # Groq
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL_FAST=${LLM_MODEL_FAST:-openai/gpt-oss-20b}
      - LLM_MODEL_SMART=${LLM_MODEL_SMART:-openai/gpt-oss-120b}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.6}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-1536}
      - LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-low}
      - API_TIMEOUT=${API_TIMEOUT:-20}

      # WhatsApp
      - WHATSAPP_MAIN_NUMBER=${WHATSAPP_MAIN_NUMBER}
      - WHATSAPP_LID=${WHATSAPP_LID:-}
      - WHATSAPP_PIN=${WHATSAPP_PIN}

      # Puppeteer/Chromium not used (Baileys connects via websocket, no browser)

      # Baileys auth storage path (inside the container)
      - BAILEYS_AUTH_PATH=/app/.baileys_auth
      - BAILEYS_LOG_LEVEL=${BAILEYS_LOG_LEVEL:-info}
      - WHATSAPP_USE_PAIRING_CODE=${WHATSAPP_USE_PAIRING_CODE:-false}
      - WHATSAPP_QR_LINK=${WHATSAPP_QR_LINK:-true}

      # Node
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=2048

      # Python
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - PYTHONUTF8=1

      # Locale (ensures emojis render correctly in logs / WhatsApp / dashboard)
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8

      # Timezone
      - TZ=Africa/Nairobi
    volumes:
      - ./data:/app/data
      - ./sessions:/app/.baileys_auth
    # Lets the container resolve "host.docker.internal" to the Docker
    # host's IP on Linux too (it works out of the box on Docker Desktop
    # for Mac/Windows, but needs this explicit mapping on Linux hosts).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - pesapilot-network

networks:
  pesapilot-network:
    driver: bridge