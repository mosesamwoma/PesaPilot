# ────────────────────────────────────────────────────────
# Just for fun — Podman/Google Chrome variant, not used for shipping.
# Same shape as docker-compose.yml, but built from podman/Containerfile
# with Google Chrome-specific env/volumes instead of Baileys ones.
# ────────────────────────────────────────────────────────
#
# Run with either:
#   podman-compose -f podman/compose.yml up -d --build
#   podman compose -f podman/compose.yml up -d --build   (podman 4+ built-in)

services:
  pesapilot:
    build:
      context: ..
      dockerfile: podman/Containerfile
    container_name: pesapilot-local
    restart: unless-stopped
    ports:
      # Published on the host's loopback only. Every route except /health
      # needs API_TOKEN, but keep it on loopback anyway: to expose it, put a
      # TLS reverse proxy in front instead of setting API_BIND=0.0.0.0.
      - "${API_BIND:-127.0.0.1}:8000:8000"
    environment:
      # API Configuration
      - API_URL=${API_URL:-http://127.0.0.1:8000}
      - WHATSAPP_API_PORT=8000
      - API_BIND_HOST=0.0.0.0
      - API_TOKEN=${API_TOKEN:?Set API_TOKEN in .env (run scripts/generate_secrets.sh)}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - API_AUTH_FAIL_LIMIT=${API_AUTH_FAIL_LIMIT:-10}
      - API_RATE_LIMIT_PER_MIN=${API_RATE_LIMIT_PER_MIN:-120}
      - API_AI_RATE_LIMIT_PER_MIN=${API_AI_RATE_LIMIT_PER_MIN:-30}

      # PostgreSQL runs separately on the host. POSTGRES_HOST=auto lets
      # src/database.py detect Podman (via /run/.containerenv) and
      # resolve host.containers.internal itself — Podman wires that
      # hostname up automatically, no extra_hosts entry needed.
      - POSTGRES_USER=${POSTGRES_USER:-pesapilot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-pesapilot}
      - POSTGRES_HOST=${POSTGRES_HOST:-auto}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}

      # Groq
      - GROQ_API_KEY=${GROQ_API_KEY:?Set GROQ_API_KEY in .env}
      - LLM_MODEL_FAST=${LLM_MODEL_FAST:-openai/gpt-oss-20b}
      - LLM_MODEL_SMART=${LLM_MODEL_SMART:-openai/gpt-oss-120b}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.6}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-1536}
      - LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-low}
      - API_TIMEOUT=${API_TIMEOUT:-20}

      # WhatsApp
      - WHATSAPP_MAIN_NUMBER=${WHATSAPP_MAIN_NUMBER:?Set WHATSAPP_MAIN_NUMBER in .env}
      - WHATSAPP_LID=${WHATSAPP_LID:-}
      - WHATSAPP_PIN=${WHATSAPP_PIN:?Set WHATSAPP_PIN in .env}

      # Scheduled summaries (cron, Africa/Nairobi; set to off to disable)
      - WEEKLY_SUMMARY_CRON=${WEEKLY_SUMMARY_CRON:-}
      - MONTHLY_SUMMARY_CRON=${MONTHLY_SUMMARY_CRON:-}

      # Puppeteer/Google Chrome — this is the whole reason this file exists
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome-stable

      # Auth storage path (inside the container) — code reads this exact var name
      - WWEBJS_AUTH_PATH=/app/.wwebjs_auth
      - WHATSAPP_QR_LINK=${WHATSAPP_QR_LINK:-false}

      # Node
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=2048

      # Python
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - PYTHONUTF8=1

      # Locale (ensures emojis render correctly in logs / WhatsApp / dashboard)
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8

      # Timezone
      - TZ=Africa/Nairobi
    volumes:
      - ../data:/app/data:Z
      - ../sessions-local:/app/.wwebjs_auth:Z
    # /dev/shm defaults to 64MB in most container runtimes, which is too
    # small for Google Chrome and causes random renderer crashes. shm_size
    # bumps it — this is arguably more important than the --disable-dev-shm-usage
    # flag the bot already passes to Chrome as a fallback.
    shm_size: 1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - pesapilot-network

networks:
  pesapilot-network:
    driver: bridge